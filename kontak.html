<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Kami - PT Maju Bersama</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">PT Maju Bersama</div>
            <ul class="nav-links">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="tentang.html">Tentang Kami</a></li>
                <li><a href="produk.html">Produk</a></li>
                <li><a href="kontak.html" class="active">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="page-title">Hubungi Kami</h1>

        <div class="contact-container">
            <!-- Informasi Kontak -->
            <div>
                <h2>Informasi Kantor</h2>
                <p style="margin-top: 1rem;"><strong>Alamat:</strong> Jl. Jendral Sudirman No. 123, Jakarta</p>
                <p><strong>Email:</strong> info@majubersama.com</p>
                <p><strong>Telepon:</strong> (021) 555-1234</p>
            </div>

            <!-- Formulir Kontak -->
            <div>
                <h2>Kirim Pesan</h2>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Nama Lengkap</label>
                        <input type="text" id="name" placeholder="Masukkan nama Anda">
                    </div>
                    <div class="form-group">
                        <label for="email">Alamat Email</label>
                        <input type="email" id="email" placeholder="Masukkan email Anda">
                    </div>
                    <div class="form-group">
                        <label for="message">Pesan</label>
                        <textarea id="message" rows="5" placeholder="Tuliskan pesan Anda..."></textarea>
                    </div>
                    <button type="submit" class="btn">Kirim Pesan</button>
                    <p id="formMessage"></p>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 PT Maju Bersama. Hak Cipta Dilindungi.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
